# Build, start and smoke-check the app. See ci/README.md for what this does and how to run it locally.
# One job on purpose: the built app is never handed between jobs through artifact storage
# (CI storage quota). Diagnostics are uploaded only on failure.
name: CI

on:
  push:
    branches: [main, mig-dev, 'stage/**', 'stabilise/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PORT: 8080
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (mvn package)
        run: mvn -B package

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - name: Install smoke check dependencies
        working-directory: ci
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ci/package-lock.json') }}

      # Skips the download when the cached browser is there; always installs the OS packages it needs.
      - name: Install Chromium
        working-directory: ci
        run: npx playwright install --with-deps chromium

      - name: Start app (production mode)
        run: ci/start-app.sh "$APP_PORT"

      - name: Smoke check
        run: node ci/smoke.cjs "http://localhost:$APP_PORT" target/smoke

      - name: Check production mode
        run: ci/check-production-mode.sh

      - name: Stop app
        if: always()
        run: ci/stop-app.sh

      - name: Upload diagnostics (failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            target/jetty.log
            target/smoke/
          retention-days: 3
          if-no-files-found: ignore
