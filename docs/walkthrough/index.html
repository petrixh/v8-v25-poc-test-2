<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow walkthrough</title>
<style>
/* Walkthrough: workflow list with keyword search on the left (a selector on phones); the selected workflow as step
   rows. Modes (data.mode): baseline (text | old), compare (text and checks | old | new), export (customer: text, then
   an old | new pair; an overview page first). System fonts, relative image paths, no outside requests. */
:root {
  --bg: #f4f6f7; --surface: #fff; --sunk: #e9edef; --line: #d3dade; --fg: #1c2427; --muted: #5a676d;
  --accent: #1f6770; --accent-soft: #dcecee; --pass: #26704a; --pass-soft: #dff0e6; --fail: #a8322b; --fail-soft: #f7e1df;
  --warn: #8a5a00; --warn-soft: #fbf0d6; --shade: rgba(12, 18, 20, .88);
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12181a; --surface: #192124; --sunk: #0f1416; --line: #2c373b; --fg: #e3e9eb; --muted: #95a3a8; --accent: #6fbcc5;
    --accent-soft: #1d3438; --pass: #72c795; --pass-soft: #173226; --fail: #ee8a82; --fail-soft: #3a1d1b; --warn: #e6b659; --warn-soft: #33290f; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
code { font-family: var(--mono); font-size: .88em; background: var(--sunk); padding: 0 .15em; border-radius: 3px; overflow-wrap: anywhere; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 13px; color: var(--muted); }
.top b { font-size: 15px; color: var(--fg); }
.top .score { color: var(--pass); font-weight: 600; }
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
nav { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding-block: 8px; background: var(--surface); }
nav ol { list-style: none; margin: 0; padding: 0; }
.search { padding: 4px 12px 8px 14px; }
input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-size: 14px; }
.cnt { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
nav button { width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 8px; padding: 7px 12px 7px 14px; border-left: 3px solid transparent; }
nav button:hover { background: var(--sunk); }
nav button[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
nav .id { font: 600 12.5px var(--mono); color: var(--accent); padding-top: 1px; overflow-wrap: anywhere; }
nav .t { font-size: 13px; line-height: 1.3; min-width: 0; }
nav .r { grid-column: 2; font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-block; font: 600 10.5px/1 var(--mono); letter-spacing: .06em; padding: 3px 6px 2px; border-radius: 3px; text-transform: uppercase; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chip.pass { color: var(--pass); background: var(--pass-soft); }
.chip.fail { color: var(--fail); background: var(--fail-soft); }
.chip.accepted { color: var(--warn); background: var(--warn-soft); }
.phonebar { display: none; }
main { padding: 20px 28px 60px; min-width: 0; }
.head { max-width: 80ch; display: grid; gap: 6px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 600 12px var(--mono); color: var(--muted); }
h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font: 600 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 8px 0 0; font-size: 14px; }
.meta dt { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; }
.meta dd { margin: 0; min-width: 0; }
.pager { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.pager button, .phonebar button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.pager button:disabled, .phonebar button:disabled { opacity: .45; cursor: default; }
.keys { color: var(--muted); font-size: 12px; }
.note { max-width: 80ch; background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 8px 12px; font-size: 14px; margin: 8px 0; }
.steps { display: grid; gap: 18px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 1000px) { .m-baseline .step { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); } }
@media (min-width: 1180px) { .m-compare .step { grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) minmax(0, 2fr); } }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.side { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.num { font: 600 12px var(--mono); color: var(--accent); letter-spacing: .06em; }
.steptext { margin: 0; }
.missing { border: 1px dashed var(--line); border-radius: 3px; padding: 12px; font-size: 13px; color: var(--muted); background: var(--sunk); }
.rec { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 8px; min-width: 0; }
.rec .line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rec .desc { font: 13px var(--mono); overflow-wrap: anywhere; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.obs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; margin: 0; font: 12.5px/1.45 var(--mono); }
.obs dt { color: var(--muted); max-width: 22ch; overflow-wrap: anywhere; }
.obs dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.box { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 6px 10px; font-size: 12px; min-width: 0; }
.box.err { background: var(--fail-soft); border-left-color: var(--fail); }
.box pre { margin: 4px 0 0; font: 11.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
figure { margin: 0; min-width: 0; }
.shot { display: block; width: 100%; padding: 0; border: 1px solid var(--line); background: var(--sunk); cursor: zoom-in; border-radius: 3px; overflow: hidden; }
.shot img { display: block; width: 100%; height: auto; }
figcaption { font: 11.5px var(--mono); color: var(--muted); margin-top: 4px; }
.m-export figcaption { font: 13px var(--body); }
.extras { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.prose { max-width: 80ch; font-size: 15px; }
.prose h3 { font-size: 15px; margin: 14px 0 2px; }
.prose p, .prose ul, .prose ol { margin: 0 0 8px; }
.wftable { border-collapse: collapse; width: 100%; max-width: 100ch; font-size: 14px; }
.wftable th, .wftable td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
.wftable a { color: var(--accent); }
.wftable .chip { white-space: normal; }
.tablewrap { overflow-x: auto; }
.src { color: var(--muted); font: 12px var(--mono); margin-top: 16px; }
.lightbox { position: fixed; inset: 0; z-index: 10; background: var(--shade); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: calc(100vh - 70px); }
.lightbox .cap { color: #e3e9eb; font: 12px var(--mono); margin-top: 8px; text-align: center; }
.lightbox .close { position: absolute; top: 10px; right: 12px; border: 1px solid #5a676d; background: #192124; color: #e3e9eb; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav { display: none; }
  .phonebar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .phonebar select { flex: 1; min-width: 0; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-size: 14px; }
  main { padding-inline: 16px; }
  h1 { font-size: 22px; }
  .step { padding: 12px; }
  .keys { display: none; }
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="phonebar">
  <input type="search" id="qm" placeholder="Search workflows" aria-label="Search workflows">
  <button type="button" id="pprev" aria-label="Previous">Prev</button>
  <select id="sel" aria-label="Workflow"></select>
  <button type="button" id="pnext" aria-label="Next">Next</button>
</div>
<div class="app">
  <nav aria-label="Workflows"><div class="search"><input type="search" id="q" placeholder="Search workflows" aria-label="Search workflows"><span class="cnt" id="qcnt"></span></div><ol id="list"></ol></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Screenshot">
  <button type="button" class="close" id="lbclose">Close (Esc)</button>
  <div><img id="lbimg" alt=""><div class="cap" id="lbcap"></div></div>
</div>

      var o = document.querySelectorAll('#sel option')[k]; o.hidden = !ok; o.disabled = !ok;
    });
    $('qcnt').textContent = phrase ? n + ' of ' + W.length + ' match' + mode : '';
  }
  function onQ(v) { $('q').value = v; $('qm').value = v; filter(v); }

  function shotHtml(s, alt) {
    var cap = s.cap || '';
    return '<figure><button type="button" class="shot" data-src="' + esc(s.src) + '" data-cap="' + esc(alt + (cap ? ': ' + cap : '')) + '" aria-label="Enlarge ' + esc(alt) + '">' +
      '<img loading="lazy" src="' + esc(s.src) + '" alt="' + esc(alt + (cap ? ': ' + cap : '')) + '"></button>' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';
  }
  function shots(r, alt) { return r.shots.length ? r.shots.map(function (s) { return shotHtml(s, alt); }).join('') : '<div class="missing">No screenshot for this step.</div>'; }
  function obsHtml(obs) {
    return obs.length ? '<dl class="obs">' + obs.map(function (kv) {
      var v = kv[1]; return '<dt>' + esc(kv[0]) + '</dt><dd>' + (v.length > 180 ? '<details><summary>' + esc(v.slice(0, 120)) + ' ...</summary>' + esc(v) + '</details>' : esc(v)) + '</dd>';
    }).join('') + '</dl>' : '';
  }
  function recHtml(r, lbl) {
    var h = '<div class="rec"><div class="line"><span class="lbl">' + lbl + '</span>' + chip(r.ok ? 'PASS' : r.accepted.length ? 'ACCEPTED' : 'FAIL') + '<span class="desc">' + esc(r.desc) + '</span></div>' + obsHtml(r.obs);
    if (r.err) h += '<div class="box err"><span class="lbl">Step error</span><pre>' + esc(r.err) + '</pre></div>';
    if (r.errors.length) h += '<div class="box err"><span class="lbl">Browser errors (' + r.errors.length + ')</span><pre>' + r.errors.map(esc).join('\n') + '</pre></div>';
    if (r.serverLog.length) h += '<div class="box"><span class="lbl">Server log (' + r.serverLog.length + ')</span><pre>' + r.serverLog.map(esc).join('\n') + '</pre></div>';
    return h + '</div>';
  }
  function acceptedHtml(r) {
    return r.accepted.map(function (x) { return '<p class="note"><b>Accepted difference.</b> ' + esc(x.landed) + '. ' + esc(x.reason) + (x.continuedBy ? '. Continued: ' + esc(x.continuedBy) : '') + '</p>'; }).join('');
  }
  function stepHtml(w, s) {
    var head = '<span class="num">STEP ' + esc(s.n) + '</span>' + (s.html ? '<p class="steptext">' + s.html + '</p>' : '');
    var oldAlt = w.id + ' step ' + s.n + ' ' + OL, newAlt = w.id + ' step ' + s.n + ' ' + NL;
    if (EXP) {
      if (s.textOnly) return '<article class="step"><div class="col">' + head + '<p class="missing">' + esc(s.textOnly) + '</p></div></article>';
      var acc = s.explain && s.explain.length;
      return '<article class="step"><div class="col">' + head + '</div><div class="pair">' +
        '<div class="col"><div class="side">' + esc(OL) + '</div>' + shots(s.old, oldAlt) + '</div>' +
        '<div class="col"><div class="side">' + esc(NL) + ' ' + (acc ? '<span class="chip accepted">accepted change</span>' : '<span class="chip pass">same outcome</span>') + '</div>' +
        shots(s['new'], newAlt) + (acc ? s.explain.map(function (e) { return '<p class="note">' + esc(e) + '</p>'; }).join('') : '') + '</div></div></article>';
    }
    var txt = '<div class="col">' + head + recHtml(s.old, CMP ? 'Old check' : 'Recorded') + (CMP && s['new'] ? recHtml(s['new'], 'New check') : '') + '</div>';
    var oldCol = '<div class="col"><div class="side">' + esc(OL) + '</div>' + shots(s.old, oldAlt) + '</div>', newCol = '';
    if (CMP) {
      var n = s['new'];
      newCol = '<div class="col"><div class="side">' + esc(NL) + ' ' + (n ? chip(n.ok ? 'PASS' : n.accepted.length ? 'ACCEPTED' : 'FAIL') : '') + '</div>' +
        (n ? shots(n, newAlt) + acceptedHtml(n) : '<div class="missing">Not reached: the new run stopped before this step.</div>') + '</div>';
    }
    return '<article class="step">' + txt + oldCol + newCol + '</article>';
  }
  function overviewHtml() {
    return '<div class="prose"><h1>' + esc(D.title) + '</h1>' + (D.overview || '') + '</div><h2>Workflows</h2><div class="tablewrap"><table class="wftable"><thead><tr><th>Id</th><th>Workflow</th><th>Role</th><th>Steps</th><th>' + esc(NL) + '</th></tr></thead><tbody>' +
      W.map(function (w) { return '<tr><td>' + esc(w.id) + '</td><td><a href="#' + esc(w.id) + '">' + esc(w.title) + '</a></td><td>' + esc(w.role) + '</td><td>' + w.steps.length + '</td><td>' + outcome(w) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function render(i, focus) {
    cur = i;
    Array.prototype.forEach.call(document.querySelectorAll('#list button'), function (b) { b.setAttribute('aria-current', String(+b.dataset.i === i)); });
    $('sel').value = String(i);
    $('pprev').disabled = i <= HOME; $('pnext').disabled = i >= W.length - 1;
    if (i < 0) { $('main').innerHTML = overviewHtml(); return; }
    var w = W[i], h = '<div class="head"><div class="eyebrow"><span>' + esc(w.id) + '</span>' +
      (EXP ? outcome(w) : '<span>' + esc(OL) + '</span>' + chip(w.result) + (CMP ? '<span>' + esc(NL) + '</span>' + chip(w.newResult) : '') + '<span>' + esc((w.at || '').replace('T', ' ').replace(/\.\d+Z$/, ' UTC')) + '</span>') +
      '</div><h1>' + esc(w.title) + '</h1><dl class="meta">' + w.meta.map(function (m) { return '<dt>' + esc(m[0]) + '</dt><dd>' + m[1] + '</dd>'; }).join('') + '</dl>' +
      '<div class="pager"><button type="button" id="prev"' + (i <= HOME ? ' disabled' : '') + '>Previous</button><button type="button" id="next"' + (i >= W.length - 1 ? ' disabled' : '') + '>Next</button><span class="keys">Left / right arrow keys switch workflow</span></div></div>';
    if (w.textSteps.length) h += '<h2>Workflow steps (' + w.textSteps.length + ')</h2><p class="note">The workflow text has ' + w.textSteps.length + ' steps and the run recorded ' + w.steps.length +
      '. They are shown separately, not matched one to one.</p><ol class="prose">' + w.textSteps.map(function (t) { return '<li value="' + t.n + '">' + t.html + '</li>'; }).join('') + '</ol><h2>Recorded steps (' + w.steps.length + ')</h2>';
    else h += '<h2>Steps (' + w.steps.length + ')</h2>';
    h += '<div class="steps">' + w.steps.map(function (s) { return stepHtml(w, s); }).join('') + '</div>';
    ['old', 'new'].forEach(function (side) {
      var x = (w.extras || {})[side];
      if (x && x.length) h += '<h2>Other screenshots, ' + esc(side === 'old' ? OL : NL) + ' (' + x.length + ')</h2><div class="extras">' + x.map(function (e) { return shotHtml(e, w.id + ' ' + (side === 'old' ? OL : NL)); }).join('') + '</div>';
    });
    if (w.sections.length) h += '<h2>' + (EXP ? 'More about this workflow' : 'Rest of the workflow text') + '</h2><div class="prose">' + w.sections.map(function (s) { return '<h3>' + esc(s.name) + '</h3>' + s.html; }).join('') + '</div>';
    if (w.file) h += '<p class="src">' + esc(w.file) + ' · ' + esc(D.oldRun) + '/' + esc(w.id) + (CMP ? ' · ' + esc(D.newRun) + '/' + esc(w.id) : '') + '</p>';
    $('main').innerHTML = h;
    $('prev').onclick = function () { go(cur - 1); };
    $('next').onclick = function () { go(cur + 1); };
    if (focus) { $('main').focus({ preventScroll: true }); window.scrollTo(0, 0); }
  }
  function go(i, fromHash) {
    if (i < HOME || i >= W.length) return;
    render(i, !fromHash);
    var tok = i < 0 ? '' : W[i].id;
    if (decodeURIComponent(location.hash.slice(1)) !== tok) { try { history.replaceState(null, '', tok ? '#' + tok : location.pathname); } catch (e) { location.hash = tok; } }
  }
  function fromHash() { var t = decodeURIComponent(location.hash.slice(1)); for (var i = 0; i < W.length; i++) if (W[i].id === t) return i; return HOME; }

  $('list').addEventListener('click', function (e) { var b = e.target.closest('button[data-i]'); if (b) go(+b.dataset.i); });
  $('sel').addEventListener('change', function () { go(+this.value); });
  $('q').addEventListener('input', function () { onQ(this.value); });
  $('qm').addEventListener('input', function () { onQ(this.value); });
  $('pprev').onclick = function () { go(cur - 1); };
  $('pnext').onclick = function () { go(cur + 1); };
  var lb = $('lb');
  function closeLb() { lb.hidden = true; $('lbimg').removeAttribute('src'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  $('main').addEventListener('click', function (e) {
    var b = e.target.closest('.shot');
    if (b) { lastFocus = b; $('lbimg').src = b.dataset.src; $('lbimg').alt = b.dataset.cap; $('lbcap').textContent = b.dataset.cap; lb.hidden = false; $('lbclose').focus(); }
  });
  lb.addEventListener('click', closeLb);
  document.addEventListener('keydown', function (e) {
    if (!lb.hidden) { if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeLb(); } return; }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); } else if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  });
  window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== cur) go(i, true); });
  render(fromHash(), false);
})();
</script>
</body>
</html>
